[build]
  command = "npm ci --prefix client --include=dev && npm run build --prefix client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = ""

[[redirects]]
  from = "/api/*"
  to = "https://my-fullstack-app-tf48.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
